<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lernkontrolle: Soziologische Grundlagen</title>
<!--
  Lernkontrolle zur Lehrveranstaltung „Soziologische Grundlagen“:
  neun Multiple-Choice-Fragen zu typischen Verwechslungen, mit erklärender Rückmeldung
  zu jeder Antwortoption. Inhalte nur im DATEN-Block ändern.
-->
<style>
  :root { --akzent: #1f5f8b; --ok: #2e7d32; --nok: #b3261e; --rand: #d0d7de; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 12px; color: #1b1f24; line-height: 1.45; }
  h1 { font-size: 1.1rem; margin: 0 0 4px; }
  .hinweis { font-size: 0.9rem; color: #57606a; margin: 0 0 10px; }
  .frage { border: 1px solid var(--rand); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
  .frage > p { margin: 0 0 8px; font-weight: 600; }
  .opt { display: block; width: 100%; text-align: left; font: inherit; font-size: 0.92rem; margin: 4px 0; padding: 7px 10px;
         border: 1px solid var(--rand); border-radius: 6px; background: #fff; cursor: pointer; }
  .opt:focus-visible { outline: 3px solid #e0a400; outline-offset: 2px; }
  .opt.ok { border: 2px solid var(--ok); background: #e8f5e9; }
  .opt.nok { border: 2px solid var(--nok); background: #fdecea; }
  .fb { font-size: 0.9rem; margin-top: 6px; }
  #summe { font-weight: 600; }
</style>
</head>
<body>
<h1 id="titel"></h1>
<p class="hinweis" id="hinweis"></p>
<div id="fragen"></div>
<p id="summe" aria-live="polite"></p>

<script>
/* ===== DATEN: Nur diesen Block ändern ===================================== */
const DATEN = {
  "titel": "Lernkontrolle: Was haben Sie behalten?",
  "hinweis": "Wählen Sie pro Frage eine Antwort. Die Rückmeldung erklärt jede Option, auch die falschen.",
  "ergebnis": "Ergebnis: {punkte} von {gesamt} richtig.",
  "fragen": [
    {
      "frage": "Nach Max Weber hat die Soziologie zwei Aufgaben, die zusammengehören. Welche?",
      "optionen": [
        {
          "text": "Beschreiben und Bewerten",
          "richtig": false,
          "warum": "Weber will soziales Handeln nicht bewerten, sondern verstehen und erklären."
        },
        {
          "text": "Deutend verstehen und ursächlich erklären",
          "richtig": true,
          "warum": "Verstehen fragt nach dem Sinn des Handelns, Erklären nach Ursachen, Abläufen und Wirkungen."
        },
        {
          "text": "Messen und Vorhersagen",
          "richtig": false,
          "warum": "Prognosen können Folge einer Erklärung sein; das Verstehen des Sinns fehlt in dieser Antwort."
        }
      ]
    },
    {
      "frage": "Ein Mensch ist arbeitslos, ebenso wie Millionen andere im Land. Wie würde C. Wright Mills diese Lage einordnen?",
      "optionen": [
        {
          "text": "Als persönliche Schwierigkeit, deren Ursachen im Charakter der Person liegen",
          "richtig": false,
          "warum": "Bei einem Einzelfall läge diese Deutung nahe; bei massenhafter Arbeitslosigkeit greift sie zu kurz."
        },
        {
          "text": "Als öffentliches Problem, dessen Ursachen in der Struktur der Gesellschaft liegen",
          "richtig": true,
          "warum": "Mills unterscheidet personal troubles und public issues; wenn viele betroffen sind, liegen die Ursachen in gesellschaftlichen Strukturen."
        },
        {
          "text": "Als Thema, mit dem sich die Soziologie nicht befasst",
          "richtig": false,
          "warum": "Gerade die Verbindung von Biografie und Gesellschaft ist der Kern der soziologischen Imagination."
        }
      ]
    },
    {
      "frage": "Was meint Durkheim mit der Regel, soziologische Tatbestände „wie Dinge“ zu betrachten?",
      "optionen": [
        {
          "text": "Menschen sollen wie Objekte behandelt werden",
          "richtig": false,
          "warum": "Es geht nicht um den Umgang mit Menschen, sondern um eine methodische Haltung."
        },
        {
          "text": "Soziale Tatsachen bestehen unabhängig vom Einzelnen und lassen sich von außen beobachten",
          "richtig": true,
          "warum": "Normen, Recht oder Sitten wirken auf den Einzelnen ein und können wie andere Gegenstände untersucht werden."
        },
        {
          "text": "Nur materielle Gegenstände sind soziologisch relevant",
          "richtig": false,
          "warum": "Gerade Normen und Regeln sind soziale Tatsachen, obwohl sie nicht materiell sind."
        }
      ]
    },
    {
      "frage": "Unter welchen Bedingungen entsteht die Soziologie im 19. Jahrhundert?",
      "optionen": [
        {
          "text": "In einer stabilen Ständegesellschaft ohne größere Veränderungen",
          "richtig": false,
          "warum": "Gerade der Zerfall der ständischen Ordnung macht Gesellschaft zur Frage."
        },
        {
          "text": "Im Zuge von Aufklärung, Revolution, Industrialisierung und Verstädterung",
          "richtig": true,
          "warum": "Die Umbrüche werfen die Frage auf, wie soziale Ordnung möglich ist, wenn Tradition sie nicht mehr garantiert."
        },
        {
          "text": "Als Teil der Theologie, um religiöse Ordnung zu begründen",
          "richtig": false,
          "warum": "Der Positivismus wendet sich ausdrücklich gegen religiöse Erklärungen."
        }
      ]
    },
    {
      "frage": "Eine Familie, ein Freundeskreis, eine Dorfgemeinschaft: Was haben diese Beispiele gemeinsam?",
      "optionen": [
        {
          "text": "Sie sind Formen von Gemeinschaft, die auf Nähe und Zugehörigkeit beruhen",
          "richtig": true,
          "warum": "Gemeinschaften beruhen auf persönlicher Bindung, Vertrautheit und Tradition (Tönnies)."
        },
        {
          "text": "Sie sind Formen von Gesellschaft, die auf Zweck und Vertrag beruhen",
          "richtig": false,
          "warum": "Zweckorientierung und Anonymität kennzeichnen Gesellschaft, etwa Unternehmen oder Behörden."
        },
        {
          "text": "Sie sind Funktionssysteme im Sinne Luhmanns",
          "richtig": false,
          "warum": "Funktionssysteme wie Recht oder Wirtschaft sind Kommunikationszusammenhänge, keine persönlichen Gruppen."
        }
      ]
    },
    {
      "frage": "Ein Lehrer hält eine Schülerin für leistungsschwach und gibt ihr deshalb eine schlechtere Empfehlung. Welcher Begriff beschreibt das?",
      "optionen": [
        {
          "text": "Autopoiesis",
          "richtig": false,
          "warum": "Autopoiesis meint die Selbsterzeugung von Systemen, nicht die Wirkung einer Deutung."
        },
        {
          "text": "Thomas-Theorem",
          "richtig": true,
          "warum": "Die Definition der Situation hat reale Folgen, unabhängig davon, ob sie zunächst zutraf."
        },
        {
          "text": "Primäre Sozialisation",
          "richtig": false,
          "warum": "Primäre Sozialisation findet vor allem in der Familie statt und betrifft grundlegende Fähigkeiten."
        }
      ]
    },
    {
      "frage": "Wie entstehen nach Berger und Luckmann Institutionen?",
      "optionen": [
        {
          "text": "Sie werden vom Staat per Gesetz eingeführt",
          "richtig": false,
          "warum": "Gesetze können Institutionen absichern; entstehen tun sie aber aus alltäglichem Handeln."
        },
        {
          "text": "Aus wiederkehrenden Handlungen, die zu Gewohnheiten werden und weitergegeben werden",
          "richtig": true,
          "warum": "Habitualisierung und Tradierung verfestigen Gewohnheiten zu Institutionen, die als objektive Wirklichkeit erscheinen."
        },
        {
          "text": "Sie sind dem Menschen angeboren",
          "richtig": false,
          "warum": "Institutionen sind menschliche Produkte, auch wenn sie uns als gegeben erscheinen."
        }
      ]
    },
    {
      "frage": "Nach Talcott Parsons wird gesellschaftliche Ordnung vor allem gesichert durch …",
      "optionen": [
        {
          "text": "gemeinsame, verinnerlichte Werte, Normen und Rollen",
          "richtig": true,
          "warum": "Parsons spricht von normativer Integration: Menschen machen gesellschaftliche Erwartungen durch Sozialisation zu ihren eigenen."
        },
        {
          "text": "Kommunikation in operativ geschlossenen Funktionssystemen",
          "richtig": false,
          "warum": "Das ist Luhmanns Antwort, die gerade ohne gemeinsame Werteklammer auskommt."
        },
        {
          "text": "den Kampf zwischen Klassen",
          "richtig": false,
          "warum": "Das ist die Konfliktperspektive von Marx, die Parsons' Konsensannahme gerade kritisiert."
        }
      ]
    },
    {
      "frage": "Dirk Baecker hat vorgeschlagen, die Soziale Arbeit als eigenes Funktionssystem zu verstehen (eine umstrittene These). Welcher Code wäre dann ihr Code?",
      "optionen": [
        {
          "text": "Recht/Unrecht",
          "richtig": false,
          "warum": "Das ist der Code des Rechtssystems."
        },
        {
          "text": "Wahr/unwahr",
          "richtig": false,
          "warum": "Das ist der Code der Wissenschaft."
        },
        {
          "text": "Hilfe/Nicht-Hilfe bzw. Fall/Nicht-Fall",
          "richtig": true,
          "warum": "Nach Baecker entscheidet die Soziale Arbeit, ob jemand hilfebedürftig ist und in ihre Zuständigkeit fällt. Ob sie tatsächlich ein eigenes Funktionssystem ist, ist in der Fachdiskussion umstritten."
        }
      ]
    },
    {
      "frage": "Ein Kind spielt Fußball und muss wissen, was Mitspieler:innen, Gegner:innen und Schiedsrichter:in erwarten. Was entsteht dabei nach Mead?",
      "optionen": [
        {
          "text": "Der generalisierte Andere",
          "richtig": true,
          "warum": "Im organisierten Spiel (Game) verinnerlicht das Kind die Erwartungen der ganzen Gruppe."
        },
        {
          "text": "Das I",
          "richtig": false,
          "warum": "Das I ist der spontane, kreative Anteil des Selbst, nicht die verinnerlichte Erwartung der Gruppe."
        },
        {
          "text": "Ein signifikanter Anderer",
          "richtig": false,
          "warum": "Signifikante Andere sind einzelne enge Bezugspersonen, etwa die Eltern."
        }
      ]
    },
    {
      "frage": "Was ist nach Bourdieu der Habitus?",
      "optionen": [
        {
          "text": "Eine angeborene Persönlichkeitseigenschaft",
          "richtig": false,
          "warum": "Der Habitus ist nicht angeboren, sondern wird vor allem in der Kindheit erworben."
        },
        {
          "text": "Ein bestimmter Dialekt oder Sprachfehler",
          "richtig": false,
          "warum": "Sprache kann Ausdruck des Habitus sein, der Begriff ist aber viel umfassender."
        },
        {
          "text": "Verinnerlichte Denk-, Wahrnehmungs- und Handlungsmuster, die die soziale Position widerspiegeln",
          "richtig": true,
          "warum": "Der Habitus ist das Ergebnis von Sozialisation und spiegelt die Stellung in der Ungleichheitsstruktur wider."
        }
      ]
    },
    {
      "frage": "Zwei Kinder haben dieselben Noten. Die Eltern des einen wählen das Gymnasium, die des anderen eine weniger anspruchsvolle Schulart. Wie nennt Boudon diesen Mechanismus?",
      "optionen": [
        {
          "text": "Primärer Herkunftseffekt",
          "richtig": false,
          "warum": "Primäre Effekte betreffen Unterschiede in den Leistungen selbst; hier sind die Leistungen gleich."
        },
        {
          "text": "Sekundärer Herkunftseffekt",
          "richtig": true,
          "warum": "Sekundäre Effekte sind herkunftsbedingte Unterschiede in den Bildungsentscheidungen bei gleicher Leistung."
        },
        {
          "text": "Fahrstuhleffekt",
          "richtig": false,
          "warum": "Der Fahrstuhleffekt (Beck) beschreibt, dass alle Schichten gemeinsam aufsteigen, die Abstände aber bleiben."
        }
      ]
    }
  ]
};
/* ===== ENDE DATEN ========================================================== */

(function () {
  document.getElementById("titel").textContent = DATEN.titel;
  document.getElementById("hinweis").textContent = DATEN.hinweis;
  const box = document.getElementById("fragen");
  let beantwortet = 0, punkte = 0;

  DATEN.fragen.forEach((f, i) => {
    const d = document.createElement("div"); d.className = "frage";
    const p = document.createElement("p"); p.textContent = (i + 1) + ". " + f.frage; d.appendChild(p);
    const fb = document.createElement("div"); fb.className = "fb"; fb.setAttribute("aria-live", "polite");
    const knoepfe = f.optionen.map((o) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "opt"; b.textContent = o.text;
      b.addEventListener("click", () => {
        if (d.dataset.fertig) return;
        d.dataset.fertig = "1"; beantwortet++; if (o.richtig) punkte++;
        knoepfe.forEach((k, j) => { if (f.optionen[j].richtig) k.classList.add("ok"); });
        if (!o.richtig) b.classList.add("nok");
        fb.innerHTML = "";
        f.optionen.forEach((x) => {
          const z = document.createElement("div");
          z.textContent = (x.richtig ? "✓ " : "✗ ") + x.text + ": " + x.warum; fb.appendChild(z);
        });
        if (beantwortet === DATEN.fragen.length)
          document.getElementById("summe").textContent = DATEN.ergebnis.replace("{punkte}", punkte).replace("{gesamt}", DATEN.fragen.length);
        meldeHoehe();
      });
      d.appendChild(b); return b;
    });
    d.appendChild(fb); box.appendChild(d);
  });

  function meldeHoehe() {
    try { window.parent.postMessage({ typ: "iframe-hoehe", hoehe: document.documentElement.scrollHeight }, "*"); } catch (e) {}
  }
  window.addEventListener("load", meldeHoehe);
  window.addEventListener("resize", meldeHoehe);
})();
</script>
</body>
</html>
