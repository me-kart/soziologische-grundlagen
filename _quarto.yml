# ─────────────────────────────────────────────────────────────
# Einstellungen des Skripts. Ändern Sie nur die Zeilen mit ← .
# Alles andere ist fertig eingerichtet.
# ─────────────────────────────────────────────────────────────
project:
  type: website
  output-dir: docs            # die fertige Webseite landet in docs/
  render:                     # nur diese Seiten werden gebaut
    - index.qmd
    - welcome.qmd
    - grundlagen/01-grundbegriffe.qmd
    - grundlagen/02-fallbeispiel-mira.qmd
    - sitzungen/01-einfuehrung.qmd
    - sitzungen/02-handeln-wirklichkeit.qmd
    - sitzungen/03-gesellschaftliche-ordnung.qmd
    - sitzungen/04-macht-herrschaft.qmd
    - sitzungen/05-kultur-normen-institutionen.qmd
    - sitzungen/06-identitaet-sozialisation-habitus.qmd
    - sitzungen/07-interaktion-gruppen-rollen.qmd
    - sitzungen/08-klassen-schichten-milieus.qmd
    - sitzungen/09-dimensionen-ungleichheit.qmd
    - sitzungen/10-bildungsungleichheit.qmd
    - sitzungen/11-modernisierung-wandel.qmd
    - sitzungen/12-sozialraum-segregation.qmd
    - 03-lernspiele.qmd
    - 04-lernkontrolle.qmd
  resources:
    - "interactions/*"        # Lernspiele werden mitkopiert
    - "fonts/*"               # Schrift Outfit (OTH), lokal eingebunden

website:
  title: "Soziologische Grundlagen"                             # ← Titel
  page-navigation: true
  sidebar:
    style: docked
    search: true
    collapse-level: 1
    contents:
      - text: "Willkommen"
        href: welcome.qmd
      - section: "Grundlagen"
        contents:
          - text: "Grundbegriffe der Soziologie"
            href: grundlagen/01-grundbegriffe.qmd
          - text: "Fallbeispiel: Mira"
            href: grundlagen/02-fallbeispiel-mira.qmd
      - section: "Sitzungen"
        contents:
          - text: "Seminarüberblick"
            href: index.qmd
          - section: "Block I · Soziologisches Denken und Gesellschaftstheorien"
            contents:
              - text: "1 · Was ist Soziologie?"
                href: sitzungen/01-einfuehrung.qmd
              - text: "2 · Soziales Handeln und gesellschaftliche Wirklichkeit"
                href: sitzungen/02-handeln-wirklichkeit.qmd
              - text: "3 · Gesellschaftliche Ordnung: Parsons und Luhmann"
                href: sitzungen/03-gesellschaftliche-ordnung.qmd
              - text: "4 · Macht und Herrschaft: Marx und Kritische Theorie"
                href: sitzungen/04-macht-herrschaft.qmd
          - section: "Block II · Individuum und Gesellschaft"
            contents:
              - text: "5 · Kultur, Normen, Werte und Institutionen"
                href: sitzungen/05-kultur-normen-institutionen.qmd
              - text: "6 · Identität, Sozialisation und Habitus"
                href: sitzungen/06-identitaet-sozialisation-habitus.qmd
              - text: "7 · Interaktion, Gruppen und Rollen"
                href: sitzungen/07-interaktion-gruppen-rollen.qmd
          - section: "Block III · Sozialstruktur und soziale Ungleichheit"
            contents:
              - text: "8 · Klassen, Schichten, Milieus, Mobilität"
                href: sitzungen/08-klassen-schichten-milieus.qmd
              - text: "9 · Dimensionen und Mechanismen sozialer Ungleichheit"
                href: sitzungen/09-dimensionen-ungleichheit.qmd
              - text: "10 · Bildungsungleichheit und Reproduktion"
                href: sitzungen/10-bildungsungleichheit.qmd
          - section: "Block IV · Gesellschaftlicher Wandel und Sozialraum"
            contents:
              - text: "11 · Modernisierung und gesellschaftlicher Wandel"
                href: sitzungen/11-modernisierung-wandel.qmd
              - text: "12 · Sozialraum, Segregation und Exklusion"
                href: sitzungen/12-sozialraum-segregation.qmd
      - section: "Üben"
        contents:
          - text: "Lernspiele"
            href: 03-lernspiele.qmd
          - text: "Lernkontrolle"
            href: 04-lernkontrolle.qmd
  page-footer:
    left: "© Prof. Dr. Mehmet Kart · CC BY-SA 4.0"         # ← Lizenzhinweis
    right: "Erstellt mit [Quarto](https://quarto.org)"

lang: de
toc-title: "Auf dieser Seite"

crossref:
  fig-title: Abbildung
  tbl-title: Tabelle
  fig-prefix: Abbildung
  tbl-prefix: Tabelle

format:
  html:
    theme:
      - cosmo
      - styles.scss
    css: fonts/outfit.css            # Schrift Outfit (OTH), ohne Google-Server
    number-sections: false
    toc: true
    toc-title: "Auf dieser Seite"
    toc-depth: 2
    toc-expand: true
    crossrefs-hover: true
    footnotes-hover: true
    link-external-newwindow: true
    callout-appearance: simple
    include-after-body:
      - include/iframe-hoehe.html    # Lernspiele bekommen automatisch die passende Höhe
      - include/theory-panel.html    # Positionen auf Sitzungsseiten aufklappen
